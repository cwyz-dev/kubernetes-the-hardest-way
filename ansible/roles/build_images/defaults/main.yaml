registry_url: ""
registry_protocol: "http"
skip_registry_check: false
build_directory: "./build"
build_metrics_path: "./metrics"
build_parallelism: 4
push_parallelism: 3
run_tests: true
multi_arch: false
build_platforms: "linux/amd64,linux/arm64"
enable_registry_cache: true
enable_smart_rebuilds: true
generate_sbom: true
scan_vulnerabilities: true
fail_on_critical_vulns: false
enable_signing: true
enable_keyless: false
cosign_key_path: "cosign.key"
enable_provenance: true
enforce_policy: false
policy_path: "./policies"
enable_structured_logging: true
enable_timing_metrics: true
enable_resume: true
